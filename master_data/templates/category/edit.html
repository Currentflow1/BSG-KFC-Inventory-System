
{% extends "base.html" %}

{% block content %}
<div class="m-4 mt-6 rounded-lg w-6xl mx-auto">
  <div class="flex justify-between items-center mb-4 mt-2">
    <h1 class="text-2xl font-bold">
      Edit Category
    </h1>

    <a href="{% url 'category_list' %}" class="p-2 rounded font-bold text-white bg-blue-600 hover:bg-blue-700">
      &larr; Back to Category
    </a>
  </div>

  <form method="post">
    {% csrf_token %}

    {% include "category/components/form.html" %}

    <div class="mt-6">
      <button type="submit" class="rounded-lg bg-green-600 px-4 py-2 text-white">
        Update Category
      </button>

      <a href="{% url 'category_list' %}" class="ml-2 rounded-lg border px-4 py-2">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
